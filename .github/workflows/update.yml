name: Aktualizacja bazy kas

on:
  schedule:
    - cron: "17 22 * * 6"
  workflow_dispatch:
    inputs:
      zrodla:
        description: "Tylko wybrane źródła (np. polregio skm). Puste = wszystkie."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-kasy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrapowanie
        run: |
          if [ -n "${{ github.event.inputs.zrodla }}" ]; then
            python scraper/main.py --only ${{ github.event.inputs.zrodla }}
          else
            python scraper/main.py
          fi

      - name: Raport
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("data/kasy.json", encoding="utf-8"))
          print(f"### Baza kas: {d['liczba']} wpisów, wersja `{d['wersja']}`\n")
          print("| Źródło | Status | Liczba | Ostatnio OK |\n|---|---|---|---|")
          for n, s in d["zrodla"].items():
              print(f"| {n} | {'✅' if s['ok'] else '❌ ' + s.get('blad','')} | {s['liczba']} | {s.get('pobrano') or '-'} |")
          EOF

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain data/wersja.json)" ]; then
            git checkout -- data/kasy.json || true
            echo "Brak zmian w danych – nic nie commituję."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Aktualizacja bazy kas $(date -u +%Y-%m-%d)"
          git push
