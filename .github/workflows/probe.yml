name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download raw pages
        run: |
          set -x
          mkdir -p raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          C="curl -sSL --compressed -A \"$UA\" -m 60"
          eval $C -o raw/polregio_page.html "https://polregio.pl/pl/dla-podroznych/gdzie-kupic-bilet/kasy-biletowe/" || true
          eval $C -o raw/polregio_ajax.html -X POST -H "X-Requested-With: XMLHttpRequest" --data "officeName=&skipCount=0&currentCulture=pl&displayCount=200&currentPageId=1469" "https://polregio.pl/umbraco/Surface/PolRegioTicketOffices/LoadMoreTicketOfficesBoxes" || true
          for p in 0 1 13; do eval $C -o raw/km_$p.html "https://www.mazowieckie.com.pl/pl/strefa-podroznych/wyszukiwarka-kas-biletomatow?page=$p" || true; done
          eval $C -o raw/kw.html "https://koleje-wielkopolskie.com.pl/dla-pasazera/pociag/kasy-biletowe/" || true
          eval $C -o raw/ic_page.html "https://www.intercity.pl/pl/site/dla-pasazera/kup-bilet/wyszukiwarka-kas-i-biletomatow.html" || true
          eval $C -o raw/ic_kutno.html -X POST --data-urlencode "city=Kutno" --data "type%5B%5D=local&type%5B%5D=international&operator%5B%5D=1&operator%5B%5D=2&search=" "https://www.intercity.pl/pl/site/dla-pasazera/kup-bilet/wyszukiwarka-kas-i-biletomatow.html" || true
          eval $C -o raw/ic_warszawa.html -X POST --data-urlencode "city=Warszawa" --data "type%5B%5D=local&type%5B%5D=international&operator%5B%5D=1&operator%5B%5D=2&search=" "https://www.intercity.pl/pl/site/dla-pasazera/kup-bilet/wyszukiwarka-kas-i-biletomatow.html" || true
          eval $C -o raw/slaskie.html "https://www.kolejeslaskie.pl/kup_bilet/na-dworcu/" || true
          eval $C -o raw/lka.html "https://lka.lodzkie.pl/kasy-biletowe/" || true
          eval $C -o raw/dolnoslaskie.html "https://kolejedolnoslaskie.pl/informacje-o-kanalach-sprzedazy/kasy-biletowe/" || true
          eval $C -o raw/malopolskie.html "https://www.kolejemalopolskie.com.pl/pl/dla-pasazera/gdzie-kupic-bilet-kolejowy" || true
          eval $C -o raw/skm.html "https://www.skm.pkp.pl/dla-pasazera/taryfy-i-przepisy/wykaz-kas-i-automatow" || true
          eval $C -o raw/arriva.html "https://arriva.pl/1032/kasy-biletowe" || true
          eval $C -o raw/arriva_bydgoszcz.html "https://arriva.pl/1035/bydgoszcz-glowna" || true
          ls -la raw
      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: raw
