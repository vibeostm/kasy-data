name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download raw pages
        run: |
          mkdir -p raw
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          get() { out="$1"; shift; code=$(curl -sSL --compressed -A "$UA" -m 60 -o "raw/$out" -w "%{http_code}" "$@" 2>>raw/_errors.txt || echo ERR); echo "$out $code" >> raw/_status.txt; }
          get polregio_ajax.html -X POST -H "X-Requested-With: XMLHttpRequest" --data "officeName=&skipCount=0&currentCulture=pl&displayCount=200&currentPageId=1469" "https://polregio.pl/umbraco/Surface/PolRegioTicketOffices/LoadMoreTicketOfficesBoxes"
          get km_0.html "https://www.mazowieckie.com.pl/pl/strefa-podroznych/wyszukiwarka-kas-biletomatow?page=0"
          get kw.html "https://koleje-wielkopolskie.com.pl/dla-pasazera/pociag/kasy-biletowe/"
          get slaskie.html "https://www.kolejeslaskie.pl/kup_bilet/na-dworcu/"
          get lka.html "https://lka.lodzkie.pl/kasy-biletowe/"
          get dolnoslaskie.html "https://kolejedolnoslaskie.pl/informacje-o-kanalach-sprzedazy/kasy-biletowe/"
          get malopolskie.html "https://www.kolejemalopolskie.com.pl/pl/dla-pasazera/gdzie-kupic-bilet-kolejowy"
          get skm.html "https://www.skm.pkp.pl/dla-pasazera/taryfy-i-przepisy/wykaz-kas-i-automatow"
          cat raw/_status.txt
      - name: Push to probe branch
        run: |
          cd raw
          git init -q -b probe-raw
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "raw pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-raw
